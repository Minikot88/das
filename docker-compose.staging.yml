services:
  gateway:
    ports: !override
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:8443:8443"

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks: [frontend_api]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${BACKUP_STORAGE_ACCESS_KEY:-staging-minio-user}
      MINIO_ROOT_PASSWORD: ${BACKUP_STORAGE_SECRET_KEY:-staging-minio-password-change-me}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks: [backup_egress]

  backend:
    environment:
      SMTP_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"

  backup-scheduler:
    environment:
      BACKUP_STORAGE_ENDPOINT: http://minio:9000
      BACKUP_RUN_ONCE: "true"
    depends_on:
      minio: { condition: service_started }
    restart: "no"

volumes:
  minio_data:
