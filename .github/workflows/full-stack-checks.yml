name: Full stack checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: dashboard_mini_bi
          MARIADB_USER: dashboard
          MARIADB_PASSWORD: dashboard
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://dashboard:dashboard@127.0.0.1:3306/dashboard_mini_bi
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/api ci
      - run: npm --prefix apps/api run prisma:generate
      - run: npm --prefix apps/api run prisma:migrate
      - run: npm --prefix apps/api run prisma:seed
      - run: npm run check:all
      - run: docker compose config
