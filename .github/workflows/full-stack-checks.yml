name: Full stack checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dashboard_mini_bi
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          TZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U dashboard -d dashboard_mini_bi"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://dashboard:dashboard@127.0.0.1:5432/dashboard_mini_bi?schema=public
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/api ci
      - run: npm --prefix apps/api run prisma:generate
      - run: npm --prefix apps/api run prisma:migrate
      - run: npm --prefix apps/api run prisma:seed
      - run: npm run check:all
      - run: docker compose config
